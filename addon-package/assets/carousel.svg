<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 900" width="600" height="900">
  <title>Portable Memory: your memory is a file you own</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <!-- the page from the icon, large -->
  <g transform="translate(170 150) scale(0.75)">
    <path d="M30 0h150l80 80v232a24 24 0 0 1-24 24H30a24 24 0 0 1-24-24V24A24 24 0 0 1 30 0z" fill="#ffffff"/>
    <path d="M180 0v56a24 24 0 0 0 24 24h56z" fill="#c7e7f5"/>
    <rect x="44" y="100" width="120" height="22" rx="11" fill="#0f766e"/>
    <rect x="44" y="144" width="176" height="22" rx="11" fill="#9fb6c8"/>
    <rect x="44" y="188" width="148" height="22" rx="11" fill="#9fb6c8"/>
    <g fill="none" stroke="#1e40af" stroke-width="20" stroke-linecap="round">
      <path d="M86 264q22 22 0 44"/><path d="M124 248q40 38 0 76"/>
    </g>
    <circle cx="56" cy="286" r="16" fill="#1e40af"/>
  </g>
  <g fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="560" font-size="52" font-weight="700">Portable Memory</text>
    <text x="300" y="625" font-size="30" opacity="0.92">Your memory is a file you own.</text>
    <text x="300" y="700" font-size="24" opacity="0.85">Nothing is saved until you say yes.</text>
    <text x="300" y="740" font-size="24" opacity="0.85">Updates keep the old fact as history.</text>
    <text x="300" y="780" font-size="24" opacity="0.85">Edit it yourself, anytime.</text>
  </g>
</svg>
